name: "SQL Challenges Vault"
domain: "sql"
description: "Ingest and validate SQL practice problems and interview challenges"
sources:
  github_queries:
    - "topic:sql-interview-questions stars:>10"
  direct_repos:
    - "https://github.com/faizanxmulla/sql-portfolio.git"
filters:
  min_stars: 10
  exclude_paths:
    - "node_modules/**"
    - "vendor/**"
    - ".git/**"
    - "dist/**"
target_schema:
  title: string
  problem_statement: string
  setup_ddl: string
  solution_sql: string
  dialect: enum[PostgreSQL, MySQL, DuckDB]
  difficulty: enum[Easy, Medium, Hard]
